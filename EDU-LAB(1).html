<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>EDU-LAB · Aprende, organiza y crece</title>
<style>
:root{
  --bg:#f3f8f3;--card:#fff;--ink:#1b2a1f;--mut:#5f7165;--line:#dbe7dc;--brand:#2e7d32;--brand2:#4caf50;--soft:#e8f5e9;
  --warn:#b45309;--danger:#dc2626;--shadow:0 1px 2px rgba(20,40,25,.06),0 6px 18px rgba(20,40,25,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a13;--card:#16241b;--ink:#e8f3ea;--mut:#9db3a2;--line:#25382b;--brand:#66bb6a;--brand2:#43a047;--soft:#1d3324;--warn:#fbbf24;--danger:#f87171;--shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1;letter-spacing:.3px}
.top h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:0}
.ib{position:relative;border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:18px}
.ib .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main{max-width:880px;margin:0 auto;padding:16px 16px 100px}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{display:flex;width:100%;max-width:880px}
#tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
#tabs button span{font-size:20px;line-height:1.1}
#tabs button[aria-current=page]{color:var(--brand)}
#tabs button[aria-current=page] span{transform:translateY(-1px) scale(1.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand)}
.chip.c{background:color-mix(in srgb,var(--c) 15%,var(--card));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
/* mascota */
.hero{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;align-items:center}
@media(max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.mascot{width:100%;max-width:220px;border-radius:20px;overflow:hidden;display:block;animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
.mascot.hop{animation:hop .8s ease}
.mascot svg{width:100%;display:block}
.pet-art{transform-box:fill-box;transform-origin:center bottom;transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.mascot.hop .pet-art{animation:pet-grow .8s cubic-bezier(.2,.8,.2,1)}
.mascot:not(.hop):hover .pet-art{transform:translateY(-3px) scale(1.025)}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes hop{0%{transform:translateY(0)}25%{transform:translateY(-18px) scale(1.04)}50%{transform:translateY(0)}70%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes pet-grow{0%{transform:scale(.88)}45%{transform:translateY(-12px) scale(1.13)}75%{transform:translateY(0) scale(.98)}100%{transform:scale(1)}}
.streak-card{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--soft),var(--card))}
.streak-fire{font-size:30px;filter:drop-shadow(0 3px 4px #f9731680)}
.streak-copy{flex:1}
.streak-copy b{font-size:15px}
.streak-copy p{margin:2px 0 0;color:var(--mut);font-size:12px}
.pet-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}
.pet-option{border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--card);text-align:center}
.pet-option.selected{border-color:var(--brand2);box-shadow:inset 0 0 0 1px var(--brand2);background:var(--soft)}
.pet-option:disabled{opacity:.55}
.pet-option span{display:block;font-size:12px;font-weight:700}
.pet-option small{color:var(--mut);font-size:11px}
.ai-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px}
.ai-tabs button[aria-pressed=true]{border-color:var(--brand2);background:var(--soft);color:var(--brand)}
.ai-output{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.ai-output h3{margin:0 0 8px;font-size:15px}
.ai-output p,.ai-output li{font-size:13px;line-height:1.55;color:var(--mut)}
.ai-output ol{padding-left:20px}
.ai-output p{margin:6px 0}
.ai-note{font-size:12px;color:var(--mut);margin:10px 0 0}
.ai-source{min-height:150px}
.ai-status{font-size:12px;color:var(--mut);margin:8px 0}
.ai-preview{display:block;max-width:180px;max-height:180px;object-fit:contain;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.ai-question{padding:10px 0;border-top:1px solid var(--line)}
.ai-question label{display:flex;gap:7px;align-items:flex-start;margin:7px 0;font-size:13px}
.ai-question input{width:auto;margin:2px 0 0}
.ai-match{display:flex;gap:8px;align-items:baseline;margin:8px 0;padding:9px;border-radius:10px;background:var(--card)}
.ai-match b{color:var(--ink)}
.ai-feedback{font-size:12px;font-weight:700;margin:5px 0}
.bar{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#66bb6a,#fbc02d);border-radius:99px;transition:width .6s}
.mname{background:none;border:0;font-size:22px;font-weight:800;padding:0;text-align:inherit}
.legend{display:flex;gap:8px;flex-wrap:wrap}
/* items */
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.item.done{opacity:.62}
.item.done .t{text-decoration:line-through}
.item .t{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .m .late{color:var(--danger);font-weight:700}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--c);background:none;color:var(--c);font-size:16px;font-weight:900;display:grid;place-items:center}
.chk.on{background:var(--c);color:#fff;cursor:default}
.subj{display:inline-flex;align-items:center;gap:5px}
.subj:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:800;margin:14px 2px 6px}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:800;color:var(--mut);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:3px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cal .d.o{opacity:.4}
.cal .d.today{border-color:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--brand2)}
.cal .d.sel{background:var(--soft);border-color:var(--brand)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dots i.dn{opacity:.35}
/* horario */
.tt{display:grid;gap:0;font-size:11px;position:relative}
.tt .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.tt .hd{font-weight:800;text-align:center;padding:5px 0;color:var(--mut)}
.tt .hr{height:48px;color:var(--mut);font-size:10px;text-align:right;padding-right:4px}
.blk{position:absolute;left:2px;right:2px;border-radius:8px;background:color-mix(in srgb,var(--c) 22%,var(--card));border:1.5px solid var(--c);padding:2px 4px;overflow:hidden;font-weight:700;font-size:10.5px;line-height:1.15}
.blk small{display:block;font-weight:500;opacity:.8}
/* forms */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;font-size:14px}
textarea{min-height:76px;resize:vertical}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt label{flex:1;min-width:90px;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;display:block}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label:has(input:checked){border-color:var(--c,var(--brand2));background:color-mix(in srgb,var(--c,var(--brand2)) 14%,var(--card))}
.opt label:has(input:focus-visible){outline:3px solid var(--brand2)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{width:34px;height:34px;border-radius:50%;background:var(--c);cursor:pointer;display:grid;place-items:center;border:3px solid transparent}
.sw label:has(input:checked){border-color:var(--ink)}
.sw input{position:absolute;opacity:0}
.err{color:var(--danger);font-size:13px;font-weight:700;margin-top:8px}
.slot{display:grid;grid-template-columns:78px 1fr 1fr 34px;gap:6px;margin-bottom:6px;align-items:center}
.slot .room{grid-column:1/4}
/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:min(520px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,12,.55);backdrop-filter:blur(2px)}
dialog .dc{padding:18px;overflow:auto;max-height:88vh}
dialog h3{margin:0 0 4px;font-size:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.kv{display:grid;grid-template-columns:100px 1fr;gap:4px 10px;font-size:13.5px;margin:10px 0}
.kv b{color:var(--mut);font-weight:700}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:12px;padding:10px;font-size:13.5px}
.ev{display:flex;gap:8px;flex-wrap:wrap}
.ev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ev a{display:inline-block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--brand)}
/* tienda */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.si{border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:var(--card)}
.si.eq{border-color:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--brand2)}
.si svg{width:100%;height:auto;border-radius:12px;display:block}
.si b{display:block;font-size:13px;margin:6px 0 4px}
/* foco */
.ring{position:relative;width:230px;height:230px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .3s ease;max-width:520px}
.toast.big{font-size:18px;background:linear-gradient(90deg,#43a047,#f9a825);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.notif{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.notif.un{font-weight:700}
.fab{position:fixed;right:16px;bottom:82px;z-index:19;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand2);color:#fff;font-size:30px;box-shadow:0 8px 20px rgba(46,125,50,.45)}
@media(min-width:900px){.fab{right:calc(50% - 424px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;background:var(--c);left:var(--x);animation:fall var(--t) linear forwards;transform:rotate(var(--r))}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>EDU-LAB <small>Estudia · crece junto a tu mascota</small></h1>
  <button class="ib" data-act="bell" aria-label="Avisos">🔔<span class="dot" id="bellDot" hidden>0</span></button>
  <button class="ib" data-act="settings" aria-label="Ajustes">⚙️</button>
</header>
<main id="view"></main>
<button class="fab" data-act="new-item" aria-label="Añadir tarea o lectura">＋</button>
<nav id="tabs" aria-label="Secciones"><div class="in">
  <button data-act="tab" data-tab="home"><span>🏠</span>Inicio</button>
  <button data-act="tab" data-tab="agenda"><span>📅</span>Agenda</button>
  <button data-act="tab" data-tab="horario"><span>🕒</span>Horario</button>
  <button data-act="tab" data-tab="plan"><span>📋</span>Planeación</button>
  <button data-act="tab" data-tab="foco"><span>🍅</span>Foco</button>
  <button data-act="tab" data-tab="tienda"><span>🛍️</span>Tienda</button>
  <button data-act="tab" data-tab="asistente"><span>✧</span>Asistente</button>
</div></nav>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* ============================================================
   EDU-LAB × Pomodoro — una sola página, sin dependencias.
   Datos: localStorage (estado) + IndexedDB (evidencias).
   ============================================================ */

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s, t) => { const [y, m, d] = s.split('-').map(Number); const [hh, mm] = (t || '00:00').split(':').map(Number); return new Date(y, m - 1, d, hh || 0, mm || 0); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const DAYS_LONG = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayIdx = d => (d.getDay() + 6) % 7;
const fmtDate = s => { const d = parseYmd(s); return `${DAYS[dayIdx(d)]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtDT = d => `${DAYS[dayIdx(d)]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const reduceMotion = () => matchMedia('(prefers-reduced-motion:reduce)').matches;

// ---------- reglas del juego ----------
const DIFF = {
  facil:   { label: 'Fácil',   pct: 5,  color: '#16a34a' },
  media:   { label: 'Media',   pct: 10, color: '#d97706' },
  dificil: { label: 'Difícil', pct: 15, color: '#dc2626' },
};
const PROJ_PCT = 30, PROJ_COLOR = '#7c3aed';
const KINDS = { tarea: { icon: '📝', label: 'Tarea' }, lectura: { icon: '📖', label: 'Lectura' }, proyecto: { icon: '🚀', label: 'Proyecto' }, practica: { icon: '🧪', label: 'Práctica' } };
const isProj = it => it.kind === 'proyecto' || it.kind === 'practica';
const pctOf = it => isProj(it) ? PROJ_PCT : DIFF[it.difficulty].pct;      // % de nivel = PAPOIS
const colorOf = it => isProj(it) ? PROJ_COLOR : DIFF[it.difficulty].color;
const SUBJECT_COLORS = ['#2563eb', '#db2777', '#059669', '#d97706', '#7c3aed', '#0891b2', '#dc2626', '#4d7c0f'];
const STAGES = ['', 'Cría', 'Peque', 'Joven', 'Adulto', 'Leyenda'];
const STAGE_FROM_LEVEL = [0, 1, 2, 3, 4, 7];
const levelOf = xp => Math.floor(xp / 100) + 1;
const stageOf = lvl => lvl >= 7 ? 5 : lvl >= 4 ? 4 : lvl;
const REMIND_PROJECT_DAYS = 4;

// ---------- tienda ----------
const SHOP = [
  { id: 'head_flor', slot: 'head', name: 'Moño de flor', price: 20 },
  { id: 'head_birrete', slot: 'head', name: 'Birrete', price: 40 },
  { id: 'head_mago', slot: 'head', name: 'Sombrero de mago', price: 70 },
  { id: 'head_corona', slot: 'head', name: 'Corona', price: 120 },
  { id: 'head_gorra', slot: 'head', name: 'Gorra aventurera', price: 35 },
  { id: 'head_cowboy', slot: 'head', name: 'Sombrero vaquero', price: 65 },
  { id: 'head_halo', slot: 'head', name: 'Aureola brillante', price: 100 },
  { id: 'face_lentes', slot: 'face', name: 'Lentes redondos', price: 25 },
  { id: 'face_sol', slot: 'face', name: 'Gafas de sol', price: 35 },
  { id: 'face_bigote', slot: 'face', name: 'Bigote', price: 20 },
  { id: 'face_monocle', slot: 'face', name: 'Monóculo elegante', price: 55 },
  { id: 'face_blush', slot: 'face', name: 'Mejillas brillantes', price: 30 },
  { id: 'neck_bufanda', slot: 'neck', name: 'Bufanda', price: 30 },
  { id: 'neck_corbatin', slot: 'neck', name: 'Corbatín', price: 25 },
  { id: 'neck_medalla', slot: 'neck', name: 'Medalla', price: 50 },
  { id: 'neck_collar', slot: 'neck', name: 'Collar con dije', price: 45 },
  { id: 'neck_flor', slot: 'neck', name: 'Collar de flores', price: 55 },
  { id: 'outfit_capa', slot: 'outfit', name: 'Capa de héroe', price: 80 },
  { id: 'outfit_delantal', slot: 'outfit', name: 'Delantal de artista', price: 65 },
  { id: 'outfit_espacio', slot: 'outfit', name: 'Traje espacial', price: 130 },
  { id: 'aura_chispa', slot: 'aura', name: 'Aura chispeante', price: 70 },
  { id: 'aura_corazones', slot: 'aura', name: 'Aura de corazones', price: 85 },
  { id: 'aura_estrella', slot: 'aura', name: 'Aura estelar', price: 120 },

   - Tarea "de un día para otro": el día anterior a la entrega, a las 17:00 (antes de las 6 pm).

function reminderAt(it) {
  if (it.done || !it.due) return null;
  if (isProj(it)) { const d = parseYmd(it.due, '09:00'); d.setDate(d.getDate() - REMIND_PROJECT_DAYS); return d; }
  let r;
  if (it.mode === 'manana') { r = parseYmd(it.due, '17:00'); r.setDate(r.getDate() - 1); }
  else if (it.leadUnit === 'h') r = new Date(dueMoment(it).getTime() - Math.max(1, it.leadN || 1) * 3600e3);
  else { r = parseYmd(it.due, '09:00'); r.setDate(r.getDate() - Math.max(1, it.leadN ?? 1)); }
  if (it.createdAt && r.getTime() < it.createdAt) {          // creada ya dentro de la ventana de aviso

const AI_STOPWORDS = new Set('para como donde cuando desde hasta sobre entre porque pero sino aunque este esta estos estas ese esa esos esas los las del con sin una uno unas unos por sus ser fue son hay cada puede pueden todo toda todos todas muy más menos también cuyo cuya cual cuales quien quienes que qué cual al la el de en y o u a es se su lo le les ya no si sí'.split(' '));
function sourceSentences(text) {
  return text.replace(/\r/g, '').split(/(?<=[.!?])\s+|\n+/).map(s => s.replace(/^[\s•*\-–\d.)]+/, '').trim()).filter(s => s.length >= 24);
}
function sourceTerms(text) {
  const counts = new Map();
  for (const word of text.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9-]{4,}/g) || []) {
    const key = word.toLocaleLowerCase('es');
    if (!AI_STOPWORDS.has(key)) counts.set(key, (counts.get(key) || 0) + 1);
  }
  return [...counts].sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).slice(0, 20).map(([word]) => word);
}
function termsInSentence(sentence, terms) {
  const lower = sentence.toLocaleLowerCase('es');
  return terms.filter(word => lower.includes(word)).sort((a, b) => b.length - a.length);
}
function aiCloze(sentence, term) {
  if (!term) return esc(sentence);
  const at = sentence.toLocaleLowerCase('es').indexOf(term);
  return esc(sentence.slice(0, at)) + '<b>________</b>' + esc(sentence.slice(at + term.length));
}
function buildQuiz(sentences, terms) {
  const entries = sentences.slice(0, 8).map(sentence => ({ sentence, term: termsInSentence(sentence, terms)[0] }));
  return `<h3>Cuestionario basado en tus apuntes</h3><p>Completa cada frase con la palabra que falta. Las respuestas son fragmentos exactos de tu material.</p>${entries.map(({ sentence, term }, i) => `<div class="ai-question"><b>${i + 1}. ${aiCloze(sentence, term)}</b><details><summary>Mostrar respuesta en mis apuntes</summary><p>${esc(sentence)}</p></details></div>`).join('')}`;
}
function buildCards(sentences, terms) {
  const entries = sentences.slice(0, 12).map(sentence => ({ sentence, term: termsInSentence(sentence, terms)[0] }));
  return `<h3>Tarjetas de repaso</h3>${entries.map(({ sentence, term }, i) => `<div class="ai-question"><b>Tarjeta ${i + 1}: ¿Qué dice el material sobre «${esc(term || 'esta idea')}»?</b><details><summary>Voltear tarjeta</summary><p>${esc(sentence)}</p></details></div>`).join('')}`;
}
function buildGame(sentences, terms) {
  const pairs = [];
  for (const sentence of sentences) {
    const term = termsInSentence(sentence, terms)[0];
    if (term && !pairs.some(pair => pair.term === term)) pairs.push({ term, sentence });
    if (pairs.length === 5) break;
  }
  if (pairs.length < 2) return '<h3>Juego de pistas</h3><p>Necesito al menos dos ideas distintas en tus apuntes para crear un juego de emparejar. Añade más texto e inténtalo otra vez.</p>';
  return `<h3>🎮 Empareja la idea con su frase</h3><p>Elige la frase de tus apuntes donde aparece cada concepto.</p>${pairs.map((pair, i) => {
    const choices = pairs.map((candidate, j) => ({ ...candidate, original: j })).sort((a, b) => ((a.original + i) % pairs.length) - ((b.original + i) % pairs.length));
    return `<section class="ai-question" data-game-question="${i}" data-answer="${choices.findIndex(choice => choice.original === i)}"><b>${i + 1}. ¿Qué frase incluye «${esc(pair.term)}»?</b>${choices.map((choice, j) => `<label><input type="radio" name="ai-game-${i}" value="${j}"><span>${esc(choice.sentence)}</span></label>`).join('')}<button class="btn sm" type="button" data-act="ai-game-check">Comprobar</button><p class="ai-feedback" aria-live="polite"></p></section>`;
  }).join('')}`;
}
function buildOrganizer(sentences, terms) {
  const center = sentences[0];
  const branches = sentences.slice(1, 8);
  return `<h3>Organizador gráfico: mapa de ideas</h3><p>Idea central (primera idea del material):</p><div class="card" style="text-align:center"><b>${esc(center)}</b></div><div class="pet-choice">${branches.length ? branches.map(sentence => `<div class="card"><b>${esc(termsInSentence(sentence, terms)[0] || 'Idea relacionada')}</b><p class="muted">${esc(sentence)}</p><span class="muted">Conecta esta frase con la idea central usando una flecha.</span></div>`).join('') : '<p>Agrega más frases para formar ramas a partir de la idea central.</p>'}</div><p>Las ramas conservan el orden en que aparecen en tu texto.</p>`;
}
function buildGuide(sentences) {

}

function loadOcrLibrary() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (ocrLibraryPromise) return ocrLibraryPromise;
  ocrLibraryPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    script.async = true;
    script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('El motor OCR no se inicializó.'));
    script.onerror = () => reject(new Error('No se pudo cargar el OCR. Revisa tu conexión a internet e inténtalo de nuevo.'));
    document.head.appendChild(script);
  }).catch(error => { ocrLibraryPromise = null; throw error; });
  return ocrLibraryPromise;
}
async function readImageText() {
  const file = $('#ai-image').files[0], status = $('#ai-ocr-status'), button = document.querySelector('[data-act="ai-read-image"]');
  if (!file) { status.textContent = 'Elige una imagen primero.'; return; }
  if (!file.type.startsWith('image/')) { status.textContent = 'El archivo seleccionado no es una imagen.'; return; }
  if (file.size > 12e6) { status.textContent = 'La imagen supera el límite de 12 MB.'; return; }
  button.disabled = true;
  status.textContent = 'Cargando OCR en español… la imagen se procesa localmente.';
  let worker;
  try {
    const Tesseract = await loadOcrLibrary();
    worker = await Tesseract.createWorker('spa', 1, {
      logger: message => { if (message.status === 'recognizing text') status.textContent = `Leyendo foto: ${Math.round(message.progress * 100)}%`; }
    });
    const { data } = await worker.recognize(file);
    const extracted = String(data.text || '').trim();
    if (!extracted) { status.textContent = 'No se encontró texto legible. Prueba con una foto más nítida o pega el texto.'; return; }
    const source = $('#ai-source');
    source.value = `${source.value.trim()}${source.value.trim() ? '\n\n' : ''}${extracted}`.slice(0, 30000);
    status.textContent = 'Texto añadido a tus apuntes. Revísalo y corrige errores del OCR antes de generar el repaso.';
    toast('Texto de la foto leído en este dispositivo.');
  } catch (error) {
    console.error('No se pudo leer el texto de la imagen.', error);
    status.textContent = error instanceof Error ? error.message : 'No se pudo procesar la foto.';
  } finally {
    try {
      if (worker) await worker.terminate();
    } catch (error) {
      console.error('No se pudo liberar el motor OCR.', error);
      status.textContent = 'El OCR terminó, pero no se pudo liberar el motor. Puedes continuar o volver a intentarlo.';
    } finally {
      button.disabled = false;
    }
  }
}

const MONTH_IDX = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11 };
function validYmd(y, m, d) { const t = new Date(y, m, d); return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d ? ymd(t) : null; }
function parseDateLoose(str) {
  str = String(str || '').trim(); if (!str) return null; let m;
  if ((m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return validYmd(+m[1], m[2] - 1, +m[3]);
  if ((m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) return validYmd(+m[3] < 100 ? 2000 + +m[3] : +m[3], m[2] - 1, +m[1]);
  if ((m = str.match(/^(\d{1,2})\s*(?:de\s+)?([a-záéíóú]{3,})\.?(?:\s*(?:de|del)?\s*(\d{4}))?$/i))) {
    const mi = MONTH_IDX[m[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').slice(0, 3)]; if (mi === undefined) return null;
    let y = m[3] ? +m[3] : new Date().getFullYear(); let r = validYmd(y, mi, +m[1]);
    if (r && !m[3] && diffDays(today(), r) < -60) r = validYmd(y + 1, mi, +m[1]);
    return r;
  }
  return null;
}
function extractDate(line) { const m = line.match(/\b(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})\b/); return m ? { date: parseDateLoose(m[1]), rest: line.replace(m[0], '').replace(/\s{2,}/g, ' ').replace(/[\s\-–:|,;]+$/, '').trim() } : { date: null, rest: line }; }
function csvRows(text) {
  const delim = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : (text.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === delim) { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c; }
  row.push(cur); rows.push(row); return rows.filter(r => r.some(c => c.trim()));
}
const COLMAP = { nombre: 'title', proyecto: 'title', actividad: 'title', titulo: 'title', 'título': 'title', especificaciones: 'specs', descripcion: 'specs', 'descripción': 'specs', criterios: 'specs', detalles: 'specs', rubrica: 'specs', 'rúbrica': 'specs', fecha: 'date', entrega: 'date', 'fecha de entrega': 'date', materia: 'subject', asignatura: 'subject', curso: 'subject', tipo: 'kind' };
function rowsToEntries(rows) {
  let map = ['title', 'specs', 'date', 'subject', 'kind'];
  const head = rows[0]?.map(c => COLMAP[c.trim().toLowerCase()]);
  if (head && head.includes('title') && head.filter(Boolean).length >= 2) { map = head; rows = rows.slice(1); }
  return rows.map(r => { const o = {}; r.forEach((c, i) => { if (map[i] && c.trim()) o[map[i]] = c.trim(); }); return o; }).filter(o => o.title);
}
function parseRubric(text, filename = '') {
  text = String(text || '').replace(/^\uFEFF/, '').trim(); if (!text) return [];
  if (/\.json$/i.test(filename) || /^[\[{]/.test(text)) {
    try { let j = JSON.parse(text); if (!Array.isArray(j)) j = j.proyectos || j.items || j.actividades || [];
      return j.map(o => { const g = (...ks) => { for (const k of ks) if (o[k] != null && String(o[k]).trim()) return String(o[k]).trim(); return ''; };
        return { title: g('nombre', 'proyecto', 'titulo', 'título', 'title', 'actividad'), specs: g('especificaciones', 'descripcion', 'descripción', 'criterios', 'specs'), date: g('fecha', 'entrega', 'fecha_entrega', 'date'), subject: g('materia', 'asignatura', 'subject'), kind: g('tipo', 'kind') }; }).filter(o => o.title);
    } catch { /* si no es JSON válido se procesa como texto */ } }
  if (/\.csv$|\.tsv$/i.test(filename)) return rowsToEntries(csvRows(text));
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith('#'));
  const delim = lines.some(l => l.includes('|')) ? '|' : lines.some(l => l.includes('\t')) ? '\t' : lines.some(l => l.includes(';')) ? ';' : null;
  if (delim) return rowsToEntries(lines.map(l => l.split(delim)));
  return lines.map(l => { const { date, rest } = extractDate(l.trim().replace(/^[-*•\d.)\s]+(?=\S)/, '')); return { title: rest || l.trim(), date: date || '' }; }).filter(o => o.title);
}
function importRubric(entries) {
  let added = 0, skipped = 0, noDate = 0, badDate = 0;
  for (const e of entries) {

    if (sn) { sub = S.subjects.find(s => s.name.toLowerCase() === sn.toLowerCase()); if (!sub) { sub = { id: uid(), name: sn.slice(0, 60), teacher: '', color: SUBJECT_COLORS[S.subjects.length % SUBJECT_COLORS.length], slots: [] }; S.subjects.push(sub); } }

    S.items.push({ id: uid(), kind: /pr[aá]ctica/i.test(e.kind || '') || (!e.kind && /^pr[aá]ctica/i.test(title)) ? 'practica' : 'proyecto', title, specs: (e.specs || '').slice(0, 3000), subjectId: sub?.id || '', due, dueTime: '', locked: !!due, source: 'rubrica', difficulty: 'dificil', mode: 'dia', done: false, createdAt: Date.now(), evidence: [] });

function exportICS() {
  const utc = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''); const loc = (s, t) => s.replace(/-/g, '') + 'T' + t.replace(':', '') + '00';

  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//EDU-LAB//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:EDU-LAB - Trabajos pendientes']; let n = 0, alarms = 0;

}

    const r = importRubric(entries); render(); checkReminders();
    toast(`Agregados: ${r.added}${r.skipped ? ` · repetidos: ${r.skipped}` : ''}${r.noDate ? ` · sin fecha: ${r.noDate}` : ''}${r.badDate ? ` · fechas no entendidas: ${r.badDate}` : ''}`);
  },
  'pomo-mode': el => { const p = S.pomo; if (p.running && !confirm('Esto detendrá el temporizador. ¿Continuar?')) return; p.running = false; p.endAt = null; p.mode = el.dataset.m; p.remaining = POMO_DUR[p.mode]; save(); render(); },
  'pomo-toggle': () => { const p = S.pomo; if (p.running) { p.remaining = pomoLeft(); p.running = false; p.endAt = null; } else { p.running = true; p.endAt = Date.now() + p.remaining * 1000; try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch { } } save(); render(); },
  'pomo-reset': () => { const p = S.pomo; p.running = false; p.endAt = null; p.remaining = POMO_DUR[p.mode]; save(); render(); },
  'shop-slot': el => { ui.shopSlot = el.dataset.s; render(); },
  buy: el => { const i = SHOP.find(x => x.id === el.dataset.id); if (!i || S.papois < i.price || S.mascot.owned.includes(i.id)) return; S.papois -= i.price; S.mascot.owned.push(i.id); S.mascot.equipped[i.slot] = i.id; save(); render(); toast(`¡${S.mascot.name} estrena: ${i.name}!`); },
  equip: el => { const i = SHOP.find(x => x.id === el.dataset.id); if (i && S.mascot.owned.includes(i.id)) { S.mascot.equipped[i.slot] = i.id; save(); render(); } },
  unequip: el => { delete S.mascot.equipped[el.dataset.s]; save(); render(); },
  'ask-perm': async () => { try { await Notification.requestPermission(); } catch { } openSettings(); },
  ics: exportICS,
  'clear-notes': () => { S.notifications = []; save(); closeDlg(); updateBell(); },
  backup: () => download(JSON.stringify(S, null, 1), `edulab-respaldo-${today()}.json`, 'application/json'),
  wipe: async () => { if (!confirm('¿Borrar TODO (mascota, tareas, horario)? No se puede deshacer.')) return; try { const db = await idb(); db.close(); dbp = null; indexedDB.deleteDatabase('edulab-evidence'); } catch { } S = defaults(); save(); closeDlg(); render(); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; if (el.tagName === 'A') e.preventDefault(); const fn = A[el.dataset.act]; if (fn) { if (el.closest('.item') && el.dataset.act !== 'open-item') e.stopPropagation(); fn(el); } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.item[data-act]')) { e.preventDefault(); A['open-item'](e.target); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'item') submitItemForm(f);
  else if (k === 'subject') submitSubject(f);
  else if (k === 'verify') {
    if (!f.elements.ok.checked) { $('#ferr', f).textContent = 'Marca la casilla para confirmar que lo hiciste.'; return; }
    const files = [...f.elements.files.files].filter(x => x.size <= 15e6); $('#vbtn').disabled = true; await completeItem(f.dataset.id, files);
  } else if (k === 'plan-add') {
    const fd = new FormData(f), due = String(fd.get('due') || '') || null, title = String(fd.get('title') || '').trim(); if (!title) return;
    S.items.push({ id: uid(), kind: fd.get('kind') === 'practica' ? 'practica' : 'proyecto', title, specs: String(fd.get('specs') || '').trim(), subjectId: String(fd.get('subjectId') || ''), due, dueTime: '', locked: false, source: 'manual', difficulty: 'dificil', mode: 'dia', done: false, createdAt: Date.now(), evidence: [] });
    save(); render(); checkReminders(); toast('Proyecto añadido');
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'ai-image') previewStudyImage();
  if (t.dataset.change === 'pomo-task') { S.pomo.taskId = t.value || null; save(); render(); }
  if (t.id === 'impf' && t.files[0]) {
    try { const j = JSON.parse(await t.files[0].text()); if (j.v !== 1 || !Array.isArray(j.items)) throw 0; if (!confirm('Esto reemplazará tus datos actuales. ¿Continuar?')) return; S = sanitize(j); save(); closeDlg(); render(); toast('Respaldo importado'); }
    catch { toast('Ese archivo no es un respaldo válido'); }
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkReminders(); updatePomoDom(); } });

// ---------- arranque ----------
if (S.pomo.running && S.pomo.endAt && Date.now() >= S.pomo.endAt) pomoFinish();
render(); checkReminders(); setInterval(checkReminders, 30000);
window.EDULAB = { get S() { return S; }, ui, render, checkReminders, reminderAt, parseDateLoose, parseRubric, importRubric, completeItem, levelOf, stageOf };
</script>
